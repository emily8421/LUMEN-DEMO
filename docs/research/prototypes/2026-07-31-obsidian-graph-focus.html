<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMEN 关系图谱原型 C</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --paper: #ffffff;
      --ink: #222935;
      --muted: #697386;
      --line: #d9dee7;
      --line-soft: #edf0f5;
      --accent: #2563eb;
      --violet: #7c3aed;
      --green: #0f766e;
      --amber: #b7791f;
      --rail: 44px;
      --tree: 286px;
      --filter: 0px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      font-size: 14px;
      line-height: 1.5;
    }

    button, input { font: inherit; color: inherit; }
    button { border: 0; background: transparent; cursor: pointer; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--rail) var(--tree) minmax(0, 1fr) var(--filter);
      grid-template-rows: 39px minmax(0, 1fr) 24px;
      overflow: hidden;
      transition: grid-template-columns 180ms ease;
    }
    .app.tree-hidden { --tree: 0px; }
    .app.filter-open { --filter: 318px; }

    .rail {
      grid-row: 1 / 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 6px 0;
      border-right: 1px solid var(--line);
      background: #f1f3f7;
    }
    .rail button {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      color: #566171;
      display: grid;
      place-items: center;
    }
    .rail button.active { background: var(--paper); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
    .rail .spacer { flex: 1; }

    .tabs {
      grid-column: 2 / 5;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }
    .tab {
      height: 34px;
      min-width: 210px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-bottom-color: transparent;
      border-radius: 7px 7px 0 0;
      background: var(--paper);
    }

    .tree-pane {
      grid-column: 2;
      min-width: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr);
      border-right: 1px solid var(--line);
      background: #f7f8fb;
    }
    .app.tree-hidden .tree-pane { border-right: 0; }

    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      gap: 8px;
    }
    .pane-head strong {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }
    .tool {
      width: 29px;
      height: 29px;
      border-radius: 6px;
      color: var(--muted);
    }
    .tool:hover { background: #eef2f7; color: var(--ink); }

    .tree-list {
      overflow: auto;
      padding: 12px 9px 26px 16px;
    }
    .folder-row {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 6px;
      border-radius: 6px;
    }
    .folder-row.active { color: #123b90; background: #eaf1ff; }
    .folder-row span:nth-child(2) {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .folder-row small { color: #9aa3b2; }
    .indent-a { margin-left: 18px; border-left: 1px solid #dfe4ec; padding-left: 8px; }
    .indent-b { margin-left: 34px; border-left: 1px solid #dfe4ec; padding-left: 8px; }

    .graph-main {
      grid-column: 3;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr);
      background: var(--paper);
    }

    .graphbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }
    .graph-title {
      text-align: center;
      font-weight: 650;
      color: #374151;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .button-row { display: flex; gap: 2px; }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 42% 38%, rgba(37,99,235,.05), transparent 28%),
        linear-gradient(#ffffff, #fbfcfe);
    }

    .graph-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .node-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% - 48px));
      min-width: 210px;
      max-width: 280px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.94);
      border-radius: 8px;
      box-shadow: 0 14px 32px rgba(31, 41, 55, .12);
    }
    .node-label strong { display: block; font-size: 13px; }
    .node-label span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

    .legend {
      position: absolute;
      left: 16px;
      bottom: 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
      background: rgba(255,255,255,.9);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot {
      width: 9px;
      height: 9px;
      display: inline-block;
      border-radius: 50%;
      background: #525966;
      margin-right: 5px;
    }
    .dot.blue { background: var(--accent); }
    .dot.green { background: var(--green); }
    .dot.amber { background: var(--amber); }

    .filter-pane {
      grid-column: 4;
      min-width: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr);
      border-left: 1px solid var(--line);
      background: #fbfcfe;
    }
    .filter-content {
      overflow: auto;
      padding: 14px;
    }
    .search-box {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
    }
    .search-box input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
    }
    .filter-section {
      padding: 14px 0;
      border-bottom: 1px solid var(--line-soft);
    }
    .filter-section h3 {
      margin: 0 0 10px;
      font-size: 13px;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      color: #374151;
    }
    .switch {
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background: #ccd2dc;
      position: relative;
      flex: 0 0 auto;
    }
    .switch::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      left: 2px;
      top: 2px;
      background: white;
      box-shadow: 0 1px 3px rgba(0,0,0,.18);
    }
    .switch.on { background: #8b5cf6; }
    .switch.on::after { left: 18px; }

    .range-row {
      margin: 12px 0 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .track {
      margin-top: 7px;
      height: 4px;
      border-radius: 8px;
      background: linear-gradient(90deg, #d7dce5 0 38%, #8b5cf6 38% 72%, #d7dce5 72%);
      position: relative;
    }
    .track::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      top: -6px;
      left: 70%;
      background: white;
      border: 1px solid #c7ccd6;
      box-shadow: 0 2px 5px rgba(31, 41, 55, .18);
    }

    .floating {
      position: absolute;
      right: 18px;
      top: 58px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .float-button {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 10px 22px rgba(31, 41, 55, .1);
      color: var(--muted);
    }
    .float-button:hover { color: var(--accent); border-color: #adc6ff; }

    .status {
      grid-column: 2 / 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid var(--line);
      background: #f6f8fb;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1100px) {
      .app { --tree: 0px; --filter: 0px; }
      .app.filter-open { --filter: 0px; }
      .legend { right: 16px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" aria-label="主导航">
      <button id="toggleTree" class="active" title="目录" aria-label="目录">▤</button>
      <button title="搜索" aria-label="搜索">⌕</button>
      <button class="active" title="关系图谱" aria-label="关系图谱">⌘</button>
      <button title="文档" aria-label="文档">□</button>
      <div class="spacer"></div>
      <button title="设置" aria-label="设置">?</button>

    <header class="tabs">

        <div class="indent-a">

          <div class="folder-row"><span>⌄</span><span>From zhjt</span><small>31</small></div>
          <div class="indent-b">
            <div class="folder-row"><span>›</span><span>5-插件开发流程</span><small>6</small></div>
            <div class="folder-row active"><span>⌄</span><span>插件开发环境安装流程</span><small>12</small></div>
            <div class="folder-row"><span>›</span><span>1-使用教程</span><small>7</small></div>
            <div class="folder-row"><span></span><span>指导文档-系统性设计</span><small></small></div>
            <div class="folder-row"><span></span><span>学习路线图</span><small></small></div>
          </div>

        <div class="folder-row"><span>›</span><span>00-AI规则</span><small>11</small></div>
        <div class="folder-row"><span>›</span><span>01-学习记录</span><small>42</small></div>
        <div class="folder-row"><span>›</span><span>03-自动化系统</span><small>37</small></div>
      </div>
    </aside>

    <main class="graph-main">
      <div class="graphbar">
        <div class="button-row">
          <button class="tool" title="返回" aria-label="返回">‹</button>
          <button class="tool" title="前进" aria-label="前进">›</button>
        </div>
        <div class="graph-title">关系图谱</div>
        <div class="button-row">
          <button class="tool" id="toggleFilter" title="筛选" aria-label="筛选">⌕</button>
          <button class="tool" title="更多" aria-label="更多">⋮</button>
        </div>
      </div>

      <section class="canvas-wrap">
        <div class="floating">
          <button class="float-button" id="toggleFilterFloat" title="筛选" aria-label="筛选">⌕</button>
          <button class="float-button" title="回到当前文档" aria-label="回到当前文档">◎</button>
        </div>

            <line x1="548" y1="330" x2="676" y2="170"></line>
            <line x1="548" y1="330" x2="790" y2="408"></line>
            <line x1="548" y1="330" x2="464" y2="560"></line>

            <line x1="464" y1="560" x2="610" y2="610"></line>
            <line x1="900" y1="230" x2="1010" y2="180"></line>
            <line x1="900" y1="230" x2="998" y2="304"></line>
          </g>
          <g stroke="#e2e6ee" stroke-width="1" opacity=".7">
            <line x1="166" y1="270" x2="308" y2="438"></line>
            <line x1="360" y1="120" x2="676" y2="170"></line>
            <line x1="430" y1="430" x2="464" y2="560"></line>

            <circle cx="930" cy="360" r="7" fill="#5b6472"></circle>
            <circle cx="938" cy="500" r="8" fill="#5b6472"></circle>

          </g>

            <circle cx="232" cy="310" r="4"></circle><circle cx="230" cy="350" r="5"></circle>

        <div class="node-label">
          <strong>指导文档-系统性设计</strong>
          <span>当前文档 · 18 条局部链接 · 仅显示当前可见资料</span>
        </div>
        <div class="legend">
          <span><i class="dot blue"></i>当前文档</span>
          <span><i class="dot"></i>文档</span>
          <span><i class="dot green"></i>术语</span>
          <span><i class="dot amber"></i>待确认</span>
        </div>
      </section>
    </main>

    <aside class="filter-pane">
      <div class="pane-head">
        <strong>筛选</strong>
        <button class="tool" id="hideFilter" title="隐藏筛选" aria-label="隐藏筛选">×</button>
      </div>
      <div class="filter-content">
        <div class="search-box"><span>⌕</span><input value="" placeholder="搜索文件..."></div>
        <section class="filter-section">
          <div class="switch-row"><span>标签</span><i class="switch"></i></div>
          <div class="switch-row"><span>附件</span><i class="switch"></i></div>
          <div class="switch-row"><span>仅显示已创建的笔记</span><i class="switch on"></i></div>
          <div class="switch-row"><span>孤立文件</span><i class="switch"></i></div>
        </section>
        <section class="filter-section">
          <h3>力度</h3>
          <div class="range-row">图谱向心力<div class="track"></div></div>
          <div class="range-row">节点间的排斥力<div class="track"></div></div>
          <div class="range-row">相连节点间的吸引力<div class="track"></div></div>
          <div class="range-row">连线长度<div class="track"></div></div>
        </section>
      </div>
    </aside>

    <footer class="status">
      <span>局部关系图 · 默认隐藏筛选面板</span>
      <span>当前集合 38 节点 · 74 连线</span>
    </footer>
  </div>

  <script>
    const app = document.getElementById('app');
    const toggleTree = document.getElementById('toggleTree');
    const hideTree = document.getElementById('hideTree');
    const toggleFilter = document.getElementById('toggleFilter');
    const toggleFilterFloat = document.getElementById('toggleFilterFloat');
    const hideFilter = document.getElementById('hideFilter');

    function setTreeHidden(hidden) {
      app.classList.toggle('tree-hidden', hidden);
      toggleTree.classList.toggle('active', !hidden);
    }

    function toggleFilterPanel(forceClose) {
      if (forceClose) app.classList.remove('filter-open');
      else app.classList.toggle('filter-open');
    }

    toggleTree.addEventListener('click', () => setTreeHidden(!app.classList.contains('tree-hidden')));
    hideTree.addEventListener('click', () => setTreeHidden(true));
    toggleFilter.addEventListener('click', () => toggleFilterPanel(false));
    toggleFilterFloat.addEventListener('click', () => toggleFilterPanel(false));
    hideFilter.addEventListener('click', () => toggleFilterPanel(true));
  </script>
</body>
</html>
