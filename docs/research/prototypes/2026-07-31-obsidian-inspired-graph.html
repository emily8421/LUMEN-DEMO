<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMEN · 关系图谱（愿景候选）</title>
<style>
  :root{--bg:#0f172a;--ink:#e2e8f0;--ink-soft:#94a3b8;--line:#1e293b;--blue:#60a5fa;--indigo:#818cf8;--cyan:#22d3ee;--pink:#f472b6}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.6 "Inter","PingFang SC",sans-serif;overflow:hidden}
  .note{background:#020617;color:#94a3b8;font-size:12px;padding:6px 16px;display:flex;gap:12px;align-items:center}
  .note .tag{background:#1e293b;color:#f472b6;padding:1px 8px;border-radius:4px}
  .topbar{height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600}
  .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--indigo));color:#0f172a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .space{color:var(--ink-soft);font-size:13px}.space b{color:var(--ink)}
  .spacer{flex:1}
  .filter{display:flex;gap:6px}
  .chip{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:12px;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:5px}
  .chip.on{background:#1e293b;color:var(--ink);border-color:#334155}
  .btn{font-size:13px;padding:6px 12px;border:1px solid var(--line);background:#0f172a;color:var(--ink);border-radius:6px;cursor:pointer}
  .btn:hover{border-color:#334155}
  .graph-wrap{position:relative;width:100%;height:calc(100vh - 48px - 30px);cursor:grab}
  .graph-wrap.dragging{cursor:grabbing}
  svg{width:100%;height:100%;display:block}
  .tooltip{position:fixed;background:#1e293b;border:1px solid #334155;color:var(--ink);font-size:12px;padding:4px 8px;border-radius:5px;pointer-events:none;display:none;z-index:20}
  .card{position:absolute;top:60px;right:16px;width:240px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px;display:none;z-index:15}
  .card h4{margin:0 0 6px;font-size:14px}
  .card .m{color:var(--ink-soft);font-size:12px;margin-bottom:10px;line-height:1.5}
  .card a{display:inline-block;font-size:12px;color:var(--blue);text-decoration:none;border:1px solid #334155;padding:4px 10px;border-radius:5px;cursor:pointer}
  .legend{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--ink-soft);display:flex;gap:14px;background:rgba(15,23,42,.6);padding:6px 12px;border-radius:8px}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .hint{position:absolute;left:16px;top:12px;font-size:11px;color:#64748b}
</style>
</head>
<body>
<div class="note"><span class="tag">愿景候选 · 探索原型 C</span><span>关系图谱（Obsidian graph view 风格）· 当前 Phase2B 不含关联图（先时间轴后关联图），仅作远期愿景视觉参考，不代表首批实现</span></div>
<div class="topbar">
  <div class="brand"><span class="logo">L</span>LUMEN</div>
  <div class="space">/ <b>产品研发空间</b> · 关系图谱</div>
  <div class="spacer"></div>
  <div class="filter">
    <div class="chip on" onclick="filter(this,'all')">全部</div>
    <div class="chip" onclick="filter(this,'design')"><span class="dot" style="background:var(--blue)"></span>设计</div>
    <div class="chip" onclick="filter(this,'tech')"><span class="dot" style="background:var(--cyan)"></span>技术</div>
    <div class="chip" onclick="filter(this,'meeting')"><span class="dot" style="background:var(--pink)"></span>会议</div>
  </div>
  <button class="btn" onclick="alert('返回文档列表（原型占位）')">← 返回列表</button>
</div>
<div class="graph-wrap" id="wrap">
  <div class="hint">拖拽平移 · 滚轮缩放 · 点击节点查看 · 悬停显示名称</div>
  <svg id="svg"><g id="viewport"></g></svg>
  <div class="legend">
    <span><i class="dot" style="background:var(--indigo)"></i>中心文档</span>
    <span><i class="dot" style="background:var(--blue)"></i>设计文档</span>
    <span><i class="dot" style="background:var(--cyan)"></i>技术调研</span>
    <span><i class="dot" style="background:var(--pink)"></i>会议纪要</span>
  </div>
  <div class="card" id="card">
    <h4 id="cardTitle">文档标题</h4>
    <div class="m" id="cardMeta"></div>
    <a onclick="alert('打开文档（原型占位）')">打开文档 →</a>
  </div>
</div>
<div class="tooltip" id="tip"></div>
<script>
  const W=1200,H=720,cx=W/2,cy=H/2;
  const color={design:'#60a5fa',tech:'#22d3ee',meeting:'#f472b6',hub:'#818cf8'};
  const nodes=[
    {id:'hub',t:'AI 润色子系统',g:'hub',x:cx,y:cy,r:16},
    {id:'n1',t:'REQ-014 需求',g:'design',x:cx-220,y:cy-120,r:10},
    {id:'n2',t:'citation 模式',g:'design',x:cx+210,y:cy-90,r:9},
    {id:'n3',t:'polish 模式',g:'design',x:cx+170,y:cy+120,r:9},
    {id:'n4',t:'API-028 契约',g:'tech',x:cx-280,y:cy+60,r:10},
    {id:'n5',t:'lumen_ai_drafts',g:'tech',x:cx-150,y:cy+200,r:9},
    {id:'n6',t:'RG-008 外发裁决',g:'design',x:cx-60,y:cy-220,r:10},
    {id:'n7',t:'GLM LLM 通道',g:'tech',x:cx+300,y:cy+30,r:10},
    {id:'n8',t:'RAG 检索复用',g:'tech',x:cx+90,y:cy-210,r:9},
    {id:'n9',t:'时间轴视图',g:'design',x:cx+340,y:cy+180,r:10},
    {id:'n10',t:'术语注入',g:'design',x:cx-330,y:cy-40,r:9},
    {id:'n11',t:'Phase2B 启动会',g:'meeting',x:cx-380,y:cy+180,r:10},
    {id:'n12',t:'写作侧边栏 UX',g:'design',x:cx+120,y:cy+260,r:9},
    {id:'n13',t:'权限过滤',g:'tech',x:cx-210,y:cy+260,r:9}
  ];
  const edges=[['hub','n1'],['hub','n2'],['hub','n3'],['hub','n4'],['hub','n6'],['hub','n8'],['n4','n5'],['n4','n7'],['n2','n8'],['hub','n10'],['hub','n9'],['n9','n12'],['n1','n11'],['n11','n6'],['hub','n12'],['n4','n13'],['n3','n7']];
  const map={};nodes.forEach(n=>map[n.id]=n);
  const SVGNS='http://www.w3.org/2000/svg';
  const VP=document.getElementById('viewport');
  const svg=document.getElementById('svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  edges.forEach(([a,b])=>{
    const A=map[a],B=map[b];
    const l=document.createElementNS(SVGNS,'line');
    l.setAttribute('x1',A.x);l.setAttribute('y1',A.y);l.setAttribute('x2',B.x);l.setAttribute('y2',B.y);
    l.setAttribute('stroke','#334155');l.setAttribute('stroke-width',1);
    l.setAttribute('data-ga',A.g);l.setAttribute('data-gb',B.g);
    VP.appendChild(l);
  });
  nodes.forEach(n=>{
    const g=document.createElementNS(SVGNS,'g');
    g.setAttribute('data-id',n.id);g.setAttribute('data-g',n.g);
    const c=document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',n.r);
    c.setAttribute('fill',color[n.g]);c.setAttribute('stroke','#0f172a');c.setAttribute('stroke-width',2);
    c.style.cursor='pointer';
    const tx=document.createElementNS(SVGNS,'text');
    tx.setAttribute('x',n.x);tx.setAttribute('y',n.y-n.r-6);tx.setAttribute('text-anchor','middle');
    tx.setAttribute('fill','#cbd5e1');tx.setAttribute('font-size',11);tx.setAttribute('pointer-events','none');
    tx.textContent=n.t;
    g.appendChild(c);g.appendChild(tx);
    VP.appendChild(g);
    const tip=document.getElementById('tip');
    c.addEventListener('mouseenter',()=>{tip.textContent=n.t+'（'+({design:'设计',tech:'技术',meeting:'会议',hub:'中心'})[n.g]+'）';tip.style.display='block'});
    c.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px'});
    c.addEventListener('mouseleave',()=>tip.style.display='none');
    c.addEventListener('click',()=>{
      document.getElementById('cardTitle').textContent=n.t;
      document.getElementById('cardMeta').textContent='分组：'+({design:'设计文档',tech:'技术调研',meeting:'会议纪要',hub:'中心文档'})[n.g]+'　·　连接度：'+(edges.filter(e=>e[0]===n.id||e[1]===n.id).length);
      document.getElementById('card').style.display='block';
    });
  });
  let vb={x:0,y:0,w:W,h:H};
  function applyVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
  const wrap=document.getElementById('wrap');
  let dragging=false,sx,sy,vbx,vby;
  wrap.addEventListener('mousedown',e=>{if(e.target.tagName==='circle'||e.target.tagName==='A')return;dragging=true;sx=e.clientX;sy=e.clientY;vbx=vb.x;vby=vb.y;wrap.classList.add('dragging')});
  window.addEventListener('mousemove',e=>{if(!dragging)return;const rect=svg.getBoundingClientRect();const k=vb.w/rect.width;vb.x=vbx-(e.clientX-sx)*k;vb.y=vby-(e.clientY-sy)*k;applyVB()});
  window.addEventListener('mouseup',()=>{dragging=false;wrap.classList.remove('dragging')});
  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=svg.getBoundingClientRect();
    const mx=(e.clientX-rect.left)/rect.width,my=(e.clientY-rect.top)/rect.height;
    const scale=e.deltaY>0?1.15:0.87;
    const nw=Math.max(360,Math.min(2400,vb.w*scale));
    const nh=nw*(H/W);
    vb.x+=(vb.w-nw)*mx;vb.y+=(vb.h-nh)*my;vb.w=nw;vb.h=nh;
    applyVB();
  },{passive:false});
  function filter(el,g){
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');
    VP.querySelectorAll('g[data-id]').forEach(node=>{
      const ok=(g==='all'||node.getAttribute('data-g')===g);
      node.style.opacity=ok?1:0.12;
    });
    VP.querySelectorAll('line').forEach(l=>{
      const ok=(g==='all'||l.getAttribute('data-ga')===g||l.getAttribute('data-gb')===g);
      l.style.opacity=ok?0.9:0.06;
    });
  }
</script>
</body>
</html>
