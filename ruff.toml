# LUMEN 后端 / 测试最小 lint 基线（P0-2 / NFR-006 / task-042，2026-08-11）。
#
# 口径（rollout §3 P0-2 / evaluation §4.3 联合裁决定稿）：
# - target Python 3.14（py314；需 ruff>=0.15.0，见 backend/requirements-dev.txt）。
# - 仅选最小规则集：E4（import）/ E7（statement）/ E9（runtime·syntax）/ F（pyflakes）。
# - 不自动格式化：本配置只供 `ruff check`；不配 [format]，CI 不跑 `ruff format`
#   （py314 target 的 formatter 多 except 改写 bug #25901/#25550 不影响 check-only）。
# - backend-lint CI job 恒 advisory（continue-on-error），仅建旧债基线，不阻断 P0。
# - E501（line-too-long，属 E5）不在选择集内，故 line-length 不影响检查结果。

target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F"]
