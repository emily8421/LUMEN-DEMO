name: Project Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --check --no-commit-id --root -r "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Check project version consistency
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION 必须是三段式 vX.Y.Z，当前：$version"
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.}（" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少当前 VERSION 的标题：## $version（"
            exit 1
          fi
          first="$(grep -E '^## v[0-9]+\.[0-9]+\.[0-9]+（' CHANGELOG.md | head -n 1 | sed -E 's/^## (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ "$first" != "$version" ]]; then
            echo "::error::CHANGELOG 顶部第一个版本标题（${first:-未找到}）不等于 VERSION（$version）；项目版本必须在顶部。"
            exit 1
          fi
          echo "版本一致性检查通过：$version"

      - name: Check derived sync boundary
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^sync[[:space:]]template[[:space:]]v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]from[[:space:]]ai-project-template$ ]]; then
            bash scripts/check-derived-sync.sh HEAD
          else
            echo "Not a template sync commit; skip derived sync boundary check."
          fi

  # --- P0-2 / NFR-006 / task-042：CI 最小代码门（A1 advisory 起步）---
  # 口径：rollout §3 P0-2 / evaluation §4.3 联合裁决定稿。
  # backend-test / frontend-build 首次 continue-on-error 起步，基线清完后、合并 main 前升 required；
  # backend-lint(ruff) 恒 advisory（记旧债基线，不阻断 P0）。不新增前端 typecheck（build 已含 tsc -b）。

  backend-test:
    name: Backend unit tests (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true   # A1 advisory 起步：基线清完后、合并 main 前移除
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run unit tests (exclude integration)
        run: python -m pytest -m "not integration" --strict-markers

  frontend-build:
    name: Frontend build (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true   # A1 advisory 起步：基线清完后、合并 main 前移除
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # build 已含 tsc -b（package.json），不加 typecheck

  backend-lint:
    name: Ruff lint (advisory baseline)
    runs-on: ubuntu-latest
    continue-on-error: true   # 恒 advisory（rollout §3 / evaluation §4.3）：记旧债基线，不阻断 P0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.14
      - name: Ruff check (E4/E7/E9/F, no format)
        run: ruff check backend/ tests/backend/
