# 轻量通用检查：whitespace / 版本一致性 / sync boundary / 前端 file-size ratchet。
# 总是触发（PR + push main，不按路径过滤）——任何改动都过一遍，单次 ~0.1min。
# 重活（后端 / 前端 CI）按路径拆分到 backend-ci.yml / frontend-ci.yml，
# 纯文档 / 规则改动只跑本 workflow，不触发 9 job 全量（省 GitHub Actions 额度，
# 见 docs/research/2026-08-14-token-optimization-candidate-analysis.md §2 A1）。
name: Project Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --check --no-commit-id --root -r "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Check project version consistency
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION 必须是三段式 vX.Y.Z，当前：$version"
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.}（" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少当前 VERSION 的标题：## $version（"
            exit 1
          fi
          first="$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+（' CHANGELOG.md | sed -E 's/^## (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ "$first" != "$version" ]]; then
            echo "::error::CHANGELOG 顶部第一个版本标题（${first:-未找到}）不等于 VERSION（$version）；项目版本必须在顶部。"
            exit 1
          fi
          echo "版本一致性检查通过：$version"

      - name: Check derived sync boundary
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^sync[[:space:]]template[[:space:]]v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]from[[:space:]]ai-project-template$ ]]; then
            bash scripts/check-derived-sync.sh HEAD
          else
            echo "Not a template sync commit; skip derived sync boundary check."
          fi

      # CQ-P1-008 前端文件膨胀 ratchet：拦新增超限文件 + 既有超限文件继续膨胀（棘轮只进不退）。
      # 基线 frontend/.file-size-baseline.json 登记既有超限文件；runner 自带 node，零依赖。
      # 放本轻量 workflow：只依赖 frontend 目录与 scripts/check-frontend-file-size.mjs，随任何改动校验。
      - name: Check frontend file-size ratchet
        working-directory: frontend
        run: node ../scripts/check-frontend-file-size.mjs

      # FG-C2 后端结构检查（2026-08-19）：按内容拦分层违规，不看行数——
      # R1 service 不 import fastapi（豁免清单登记 auth_context.py）/ R2 api 不 import ORM /
      # R3 repository·model 不 import fastapi。依据 05 §4.1.1 职责表 + §4.2；runner 自带 node，零依赖。
      - name: Check backend structure
        run: node scripts/check-backend-structure.mjs

      # R1 后端文件膨胀 ratchet（2026-08-19，FG-C2 扩容）：补齐前后端治理不对称。
      # 基线 backend/.file-size-baseline.json 登记既有超限文件（service×6 + model×3）；
      # repository/migrations 不设行数门（理由见脚本头注释）。与前端版同构，零依赖。
      - name: Check backend file-size ratchet
        run: node scripts/check-backend-file-size.mjs

      # 2026-08-16 主题试点 CSS 纪律：styles/ 除 tokens.css 外零字面色值（ai/project-rules.md §5.1）。
      # tokens.css 是唯一定义点；组件文件只准 var(--xxx)，防硬编码欠账回潮。
      - name: Check frontend CSS token discipline
        working-directory: frontend
        run: node ../scripts/check-frontend-css.mjs

      # 2026-08-17 图表生成式镜像同步校验：docs/diagrams/ + docs/tables/ 是
      # scripts/extract-diagrams.mjs 从文档正文抽取的产物；文档改图 / 改表后
      # 未重跑脚本即镜像过期，此步拦下。runner 自带 node，零依赖。
      - name: Check docs diagrams/tables mirror sync
        run: node scripts/extract-diagrams.mjs --check
