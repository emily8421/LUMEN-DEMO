name: Project Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --check --no-commit-id --root -r "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Check project version consistency
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION 必须是三段式 vX.Y.Z，当前：$version"
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.}（" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少当前 VERSION 的标题：## $version（"
            exit 1
          fi
          first="$(grep -E '^## v[0-9]+\.[0-9]+\.[0-9]+（' CHANGELOG.md | head -n 1 | sed -E 's/^## (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ "$first" != "$version" ]]; then
            echo "::error::CHANGELOG 顶部第一个版本标题（${first:-未找到}）不等于 VERSION（$version）；项目版本必须在顶部。"
            exit 1
          fi
          echo "版本一致性检查通过：$version"

      - name: Check derived sync boundary
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^sync[[:space:]]template[[:space:]]v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]from[[:space:]]ai-project-template$ ]]; then
            bash scripts/check-derived-sync.sh HEAD
          else
            echo "Not a template sync commit; skip derived sync boundary check."
          fi

  # --- P0-2 / NFR-006 / task-042：CI 最小代码门 ---
  # 口径：rollout §3 P0-2 / evaluation §4.3 联合裁决定稿（A1）。
  # backend-test / frontend-build 基线已清（CI 运行不强制阻断——免费版私有仓库无分支保护）；backend-lint(ruff) 恒 advisory（记旧债基线，不阻断）。
  # 不新增前端 typecheck（build 已含 tsc -b）。

  backend-test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run unit tests (exclude integration)
        run: python -m pytest -m "not integration" --strict-markers

  # --- 维护态批11 / Sprint-36：PG integration 全量入 CI gate（闭环 docs/05 §4.2.4「另议」）---
  # 独立 job：unit gate（backend-test）保持无 DB 依赖（hermetic）；integration gate 由 merge 前人工核对（免费版私有仓库无分支保护，未强制 required）。
  # DB：pgvector/pgvector:pg16 服务容器；guard 三 env 在 job 级注入（pytest 子进程继承，先于 db.py 模块 import 生效）。
  # 易错点①：不挂 /docker-entrypoint-initdb.d/ —— 服务容器先于 checkout 启动，挂载点尚无仓库文件，
  #   Docker 会把缺失源 bind-mount 成空目录 → entrypoint 处理 .sql 报错 → 容器起不来。lumen_test 由预检幂等补建。
  # 易错点②：healthcheck 用 -h 127.0.0.1（TCP）——官方镜像 init 阶段临时 server 只开 unix socket，
  #   走 TCP 才能确保「正式 server 已接受连接」才置绿。
  backend-integration:
    name: Backend integration tests (PG)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUMEN_ENV: test
      ALLOW_DESTRUCTIVE_TEST_DB: "1"          # 必须引号成字符串 "1"（guard 精确字符串比对）
      DATABASE_URL: postgresql://lumen:lumen@localhost:5432/lumen_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumen -d lumen -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # 预检 = 三重 fail-closed 门（杜绝 PG 不可达 / lumen_test 缺失 / 镜像缺 pgvector 时静默 skip 假绿）：
      #   ① 复用 tests/backend/pg_test_support.assert_test_database_safe（guard 三条件与测试同源）；
      #   ② 连接 DATABASE_URL（连不上 → job 失败，非 skip）；
      #   ③ 库缺失则幂等补建（initdb.d 挂载在 GH Actions 不可靠，预检补建为主路径）；
      #   ④ 校验 pg_available_extensions 含 vector（镜像选错 → 提前 fail，避免 5 类全 skip）。
      - name: Preflight - safe test DB reachable + pgvector available (fail-closed)
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.path.join(os.getcwd(), "tests", "backend"))
          from pg_test_support import assert_test_database_safe  # noqa: E402
          from psycopg import sql
          from urllib.parse import urlsplit
          import psycopg

          url = os.environ["DATABASE_URL"]
          assert_test_database_safe(url)          # guard 三条件，任一不满足抛 UnsafeTestDatabaseError

          db = urlsplit(url).path.lstrip("/").split("/")[0]

          def ping(target):
              with psycopg.connect(target, connect_timeout=10) as conn, conn.cursor() as cur:
                  cur.execute("SELECT version()")
                  print("PG OK:", cur.fetchone()[0])
                  cur.execute("SELECT name FROM pg_available_extensions WHERE name='vector'")
                  if cur.fetchone() is None:
                      raise SystemExit("pgvector extension unavailable (image should be pgvector/pgvector:pg16)")

          # 幂等确保 lumen_test 存在：连接失败时 psycopg 抛的是通用 OperationalError（非 InvalidCatalogName
          # 子类，SQLSTATE 只在 diag），不能依赖 except 精确匹配；改经必建的 postgres 管理库查 pg_database 后建。
          admin = url.rsplit("/", 1)[0] + "/postgres"  # postgres 库 initdb 必建
          with psycopg.connect(admin, connect_timeout=10, autocommit=True) as conn, conn.cursor() as cur:
              cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
              if cur.fetchone() is None:
                  cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(db)))
                  print(f"db {db!r} missing -> created")
              else:
                  print(f"db {db!r} already exists")

          ping(url)

      # 48 用例；预检已保证 PG 可达 → 唯一合法 skip 是 embedding 软依赖（≤1）。
      # 行尾 grep guard 防假绿：断言至少 1 个 passed（杜绝「48 skipped」静默全绿）。
      - name: Run integration tests (48 cases; PG reachability gated by preflight)
        run: |
          set -o pipefail
          python -m pytest tests/backend -m integration --strict-markers -rs -q --tb=short 2>&1 | tee integration.log
          grep -qE '[1-9][0-9]* passed' integration.log || { echo '::error::integration 无 passed（疑似全部静默 skip）'; exit 1; }

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # build 已含 tsc -b（package.json），不加 typecheck

  frontend-lint:
    name: Frontend ESLint (advisory baseline)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory 起步（eslint B1 / 维护态批13）：记 10 基线，Slice B 清完升 required 移除此行
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-lint:
    name: Ruff lint (advisory baseline)
    runs-on: ubuntu-latest
    continue-on-error: true   # 恒 advisory（rollout §3 / evaluation §4.3）：记旧债基线，不阻断 P0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.14
      - name: Ruff check (E4/E7/E9/F, no format)
        run: ruff check backend/ tests/backend/
