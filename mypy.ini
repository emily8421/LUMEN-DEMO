# mypy config (maintenance batch 14 / mypy B1 Slice A, 2026-08-12).
# Comments kept ASCII-only: Windows configparser reads mypy.ini with the locale
# codec (gbk on CN Windows); non-ASCII comments raise UnicodeDecodeError locally
# even though CI (UTF-8) would parse them. Keys/values are ASCII regardless.
#
# Start: default (non-strict) + a few warns; checks backend/ (not tests).
# Baseline & root cause: docs/research/2026-08-12-backend-mypy-b1-assessment.md
# (first run 190 errors: 120 optional-import reassignment cluster +
#  45 current_space_id None propagation + 8 reportlab missing stubs + ~17 real bugs).
#
# Gradual strategy (mirrors eslint B1 three-phase):
#   Slice A (this config) = advisory start (CI backend-typecheck continue-on-error), no fixes.
#   Slice B = clear baseline (optional-import + current_space_id decision + reportlab override +
#              real bugs) -> promote to required.
#   Slice C (future) = ratchet to strict (disallow_untyped_defs etc.).
#
# Non-strict start (default baseline already 190; strict estimate 250-350, defer to Slice C).
# SQLAlchemy 2.0 static stubs (no plugin needed); pydantic v2 ships py.typed.
# reportlab missing stubs: Slice B adds [[tool.mypy.overrides]] module="reportlab.*"
#   ignore_missing_imports=true.

[mypy]
python_version = 3.14
packages = backend
namespace_packages = True
explicit_package_bases = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True

# Not enabled at start (Slice C future ratchet):
# disallow_untyped_defs = True
# disallow_any_generics = True
# warn_return_any = True
# disallow_untyped_calls = True

# reportlab ships no py.typed stubs; ignore missing imports
# (Slice B-1, clears 8 [import-untyped] in service/export.py).
[mypy-reportlab.*]
ignore_missing_imports = True
