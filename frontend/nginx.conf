# LUMEN 前端 Nginx 配置（⑪ 生产部署）：
# 静态托管 Vite 构建产物 + /api 反代后端 + SPA history fallback。
# ${LUMEN_BACKEND_URL} 由 Dockerfile 经 envsubst 注入（默认 http://backend:8000）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：非文件 /api 请求回 index.html（前端无真实路由，此处兜底刷新）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到后端（prod 无跨域问题，同源）
    location /api/ {
        proxy_pass ${LUMEN_BACKEND_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # FastAPI 流式 / 长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
